# ════════════════════════════════════════════════════════════════════════════
#  Customer KYC API — GitHub Actions CI/CD
#
#  Pipeline stages:
#    1. build-and-test   — Runs the multi-stage Docker build on RHEL 9 UBI.
#                          All 36 tests execute inside the container; output
#                          is streamed to the Actions log via --progress=plain.
#    2. push-to-ghcr     — (main branch only) Pushes the verified image to
#                          GitHub Container Registry (ghcr.io).
#
#  Target OS: Red Hat Enterprise Linux 9.8 (UBI 9) — baked into the Docker
#             base images mcr.microsoft.com/dotnet/sdk:10.0-rhel.9 and
#             mcr.microsoft.com/dotnet/aspnet:10.0-rhel.9.
# ════════════════════════════════════════════════════════════════════════════

name: CI — Build, Test & Push (RHEL 9 / .NET 10)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

env:
  # Image name in GitHub Container Registry
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/customer-kyc-poc

# Least-privilege token: read-only by default; packages:write added only
# in the push job where it is actually needed.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1 — Build + Test
  # Runs the full multi-stage Dockerfile.  The build stage compiles the
  # solution and executes all 36 xUnit tests inside a RHEL 9 container.
  # --progress=plain streams every line of Docker output (including dotnet
  # test results) directly to the GitHub Actions log.
  # ──────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test on RHEL 9 (Docker)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Docker Buildx ──────────────────────────────────────────────────
      # Buildx is required for layer caching and multi-platform builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Build (--progress=plain shows all dotnet test output) ──────────
      # The Dockerfile pulls registry.access.redhat.com/ubi9/ubi:9.8 as the
      # base and installs .NET SDK/Runtime from Microsoft's RHEL 9 RPM feed.
      # All 36 tests run inside RHEL 9.8 during Stage 1.  Any test failure
      # exits non-zero, failing the job and blocking the PR merge.
      - name: Build Docker image (RHEL 9.8 UBI, .NET 10)
        run: |
          docker buildx build \
            --progress=plain \
            --load \
            --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.IMAGE_NAME }}:latest \
            .

      # ── 4. Smoke-test the built image ─────────────────────────────────────
      # Start the container (no SQL Server — just confirm the runtime starts,
      # TDESEncrypt.dll self-test passes, and the health endpoint responds).
      - name: Smoke-test — start container
        run: |
          docker run -d \
            --name kyc-smoke \
            --env ASPNETCORE_ENVIRONMENT=Development \
            --env ASPNETCORE_URLS="http://+:8080" \
            --env Jwt__Secret="ci-smoke-test-secret-at-least-32-chars!!" \
            --env Jwt__Issuer="CustomerKycApi" \
            --env Jwt__Audience="CustomerKycApiUsers" \
            --env Encryption__Key="ci-smoke-test-encryption-key-32c!!" \
            --env Auth__Username="poc-user" \
            --env Auth__Password="poc-password" \
            --env ConnectionStrings__DefaultConnection="Server=localhost;Database=CiTestDb;User Id=sa;Password=Placeholder;" \
            --publish 8080:8080 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke-test — wait for startup (10 s)
        run: sleep 10

      - name: Smoke-test — print container logs (shows RHEL OS + TDES self-test)
        run: docker logs kyc-smoke

      # Note: /health does not require a database connection, so it will
      # respond even though SQL Server is not running in CI smoke.
      - name: Smoke-test — GET /health
        run: |
          RESPONSE=$(curl -sf http://localhost:8080/health)
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"Healthy"' \
            && echo "✅ Health check PASSED" \
            || (echo "❌ Health check FAILED" && exit 1)

      - name: Smoke-test — stop container
        if: always()
        run: docker rm -f kyc-smoke || true

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2 — Push to GitHub Container Registry
  # Runs only on pushes to main (not on PRs).  Requires the build job to
  # succeed first.  Tags the image with both the commit SHA and "latest".
  # ──────────────────────────────────────────────────────────────────────────
  push-to-ghcr:
    name: Push to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: build-and-test

    # Only push on main branch pushes; skip for PRs and other branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Log in to GitHub Container Registry ──────────────────────────────
      # GITHUB_TOKEN is automatically provided by Actions; no manual secret
      # is needed for ghcr.io pushes within the same repository.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Extract image metadata (tags + labels) ────────────────────────────
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with the short commit SHA (e.g. sha-a1b2c3d)
            type=sha,prefix=sha-,format=short
            # Tag the main branch head as "latest"
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with branch name (e.g. main)
            type=ref,event=branch

      # ── Build and push in one step (uses layer cache) ─────────────────────
      # Re-runs the Dockerfile including tests.  The NuGet restore layer is
      # cached by Buildx between runs, so subsequent builds are much faster.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the GitHub Actions cache to speed up future runs.
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          # Stream full Docker output (shows test results) in the Actions log.
          build-args: |
            BUILDKIT_PROGRESS=plain
